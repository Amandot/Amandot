name: GitHub-Profile-3D-Contrib

on:
  schedule: # Runs once a day at 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          
      - name: Crop SVG to hide charts
        run: |
          # This reduces the overall height of the SVG viewport to cut off the bottom charts
          sed -i 's/viewBox="0 0 1280 850"/viewBox="0 0 1280 450"/g' profile-3d-contrib/profile-night-rainbow.svg
          sed -i 's/height="850"/height="450"/g' profile-3d-contrib/profile-night-rainbow.svg

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated"; then
            git push
          fi
